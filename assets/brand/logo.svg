  <path d="M 396 122 C 397 144 398 147 420 148 C 398 149 397 152 396 174 C 395 152 394 149 372 148 C 394 147 395 144 396 122 Z"
        fill="#FFFFFF" opacity="0.85"/>
  <path d="M 118 352 C 119 366 120 368 134 369 C 120 370 119 372 118 386 C 117 372 116 370 102 369 C 116 368 117 366 118 352 Z"
