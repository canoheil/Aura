name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # The project documents Python 3.11+; 3.11 is the version this build is
      # validated against. Add more versions here once they are tested.
      matrix:
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Compile application modules
        run: python -m compileall -q . -x '(^|/)(\.venv|venv|env)/'

      - name: Run tests
        # The suite is hermetic: no API keys, no network, no real Telegram calls.
        # bot.py is only imported by fixtures that set dummy credentials first.
        run: python -m pytest
