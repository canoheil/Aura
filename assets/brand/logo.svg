<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Aura">
  <title>Aura</title>
  <desc>The Aura mark on a deep-indigo tile</desc>
  <defs>
    <linearGradient id="aura-bg" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#2E2760"/>
      <stop offset="0.5" stop-color="#171334"/>
      <stop offset="1" stop-color="#090713"/>
    </linearGradient>
    <radialGradient id="aura-glow" cx="0.5" cy="0.44" r="0.58">
      <stop offset="0" stop-color="#8B79F0" stop-opacity="0.42"/>
      <stop offset="0.65" stop-color="#5A4FD0" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#0B0920" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="aura-ray" x1="0.22" y1="0.02" x2="0.78" y2="0.98">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.24" stop-color="#DED3FF"/>
      <stop offset="0.56" stop-color="#9B87F2"/>
      <stop offset="0.82" stop-color="#68A6F6"/>
