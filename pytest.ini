[pytest]
# Tests live next to the flat application modules, so the repository root is
# the test root as well. This file exists so `python -m pytest` works from a
# fresh clone without extra flags.
testpaths = .
python_files = test_*.py
python_functions = test_*
python_classes = Test*
norecursedirs = .git .venv venv env .pytest_cache .mypy_cache .ruff_cache __pycache__ build dist node_modules
addopts = -ra
