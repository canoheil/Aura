name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # The linter is tiny and has no project dependencies, so it runs first and
      # fails fast: a typo shouldn't wait for the dependency install below.
      - name: Install ruff
        run: python -m pip install "ruff>=0.17,<1"

      - name: Lint
        run: ruff check . --output-format=github

  pytest:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # The project documents Python 3.11+; 3.11 is the version this build is
      # validated against. Add more versions here once they are tested.
      matrix:
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Compile application modules
        run: python -m compileall -q . -x '(^|/)(\.venv|venv|env)/'

      - name: Guard against committing runtime data
        # .gitignore should make this impossible, but a bot.db in the repository
        # would expose every user's messages, so it is checked, not assumed.
        run: python repo_guard.py

      - name: Run tests
        # The suite is hermetic: no API keys, no network, no real Telegram calls.
        # bot.py is only imported by fixtures that set dummy credentials first.
        run: python -m pytest
