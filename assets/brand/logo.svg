  <rect width="512" height="512" rx="114" fill="url(#aura-bg)"/>
  <circle cx="256" cy="250" r="214" fill="url(#aura-glow)"/>

  <circle cx="256" cy="256" r="176" fill="none" stroke="url(#aura-halo)" stroke-width="7"
