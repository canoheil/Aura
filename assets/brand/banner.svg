<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-label="Aura">
  <title>Aura — a self-hosted AI assistant for Telegram</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#241E4E"/>
      <stop offset="0.45" stop-color="#151130"/>
      <stop offset="1" stop-color="#08060F"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8B79F0" stop-opacity="0.45"/>
      <stop offset="0.6" stop-color="#5A4FD0" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#08060F" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ray" x1="0.22" y1="0.02" x2="0.78" y2="0.98">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.24" stop-color="#DED3FF"/>
      <stop offset="0.56" stop-color="#9B87F2"/>
      <stop offset="0.82" stop-color="#68A6F6"/>
      <stop offset="1" stop-color="#3FC9F4"/>
    </linearGradient>
    <linearGradient id="orbit" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D3C9FF" stop-opacity="0.85"/>
      <stop offset="0.55" stop-color="#9B87F2" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#3FC9F4" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.62" stop-color="#E8E3FF"/>
      <stop offset="1" stop-color="#C9BFFF"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9B87F2" stop-opacity="0"/>
      <stop offset="0.35" stop-color="#9B87F2" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#3FC9F4" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="400" fill="url(#bg)"/>
  <ellipse cx="350" cy="200" rx="360" ry="270" fill="url(#glow)"/>
  <ellipse cx="820" cy="120" rx="380" ry="200" fill="url(#glow)" opacity="0.35"/>

  <!-- scattered stars, small enough to be texture -->
  <g fill="#FFFFFF">
    <circle cx="86" cy="64" r="1.6" opacity="0.5"/>
    <circle cx="420" cy="52" r="1.2" opacity="0.35"/>
    <circle cx="700" cy="330" r="1.4" opacity="0.3"/>
    <circle cx="1090" cy="86" r="1.8" opacity="0.45"/>
    <circle cx="1150" cy="300" r="1.3" opacity="0.35"/>
    <circle cx="530" cy="352" r="1.1" opacity="0.25"/>
    <circle cx="960" cy="46" r="1.5" opacity="0.4"/>
    <circle cx="300" cy="360" r="1.3" opacity="0.3"/>
  </g>

  <!-- the mark -->
  <g transform="translate(326 200)">
    <circle cx="0" cy="0" r="132" fill="none" stroke="url(#orbit)" stroke-width="6"
            stroke-linecap="round" stroke-dasharray="705 124" stroke-dashoffset="148"
            transform="rotate(-62)"/>
    <!-- the mark, scaled to sit inside this halo -->
    <g transform="translate(0 0) scale(0.64) translate(-256 -256)">
      <path d="M 256 44 Q 293 219 420 256 Q 293 293 256 468 Q 219 293 92 256 Q 219 219 256 44 Z"
            fill="url(#ray)"/>
      <path d="M 256 74 Q 262 196 268 232 Q 256 246 244 232 Q 250 196 256 74 Z"
            fill="#FFFFFF" opacity="0.55"/>
    </g>
    <path d="M 106 -84 C 107 -65 108 -62 127 -61 C 108 -60 107 -57 106 -38 C 105 -57 104 -60 85 -61 C 104 -62 105 -65 106 -84 Z"
          fill="#FFFFFF" opacity="0.85"/>
    <path d="M -104 77 C -103 90 -102 92 -89 93 C -102 94 -103 96 -104 109 C -105 96 -106 94 -119 93 C -106 92 -105 90 -104 77 Z"
          fill="#8FF0FF" opacity="0.85"/>
  </g>

  <!-- wordmark -->
  <text x="512" y="196" font-family="Vazirmatn" font-size="112" font-weight="bold"
        letter-spacing="16" fill="url(#word)">AURA</text>
  <rect x="514" y="238" width="150" height="3" rx="1.5" fill="url(#accent)"/>
  <text x="514" y="292" font-family="Vazirmatn" font-size="27" letter-spacing="0.6" fill="#B9AEFF">
    A self-hosted AI assistant for Telegram
  </text>
  <text x="514" y="336" font-family="Vazirmatn" font-size="25" letter-spacing="0.4" fill="#7EE6FF">
    فارسی‌محور · مستقل از مدل · روی تلگرام
  </text>
</svg>
